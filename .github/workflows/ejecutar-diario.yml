name: Radar de mercados diario

on:
  schedule:
    # MINUTO HORA DÍA-MES MES DÍA-SEMANA (UTC)
    # Aquí: todos los días a las 7:00 UTC (8:00 o 9:00 en España según verano/invierno)
    - cron: "0 7 * * 1"   # lunes (1) a las 7:00 UTC (MINUTO HORA DÍA_MES MES DÍA_SEMANA)

  workflow_dispatch:  # Permite lanzarlo manualmente desde la interfaz

jobs:
  run-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script radar_mercados_global_html.py
        run: python radar_mercados_global_html.py

      - name: Subir informe HTML como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: informe-mercados
          path: informe_mercados.html

      - name: Enviar informe por Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Enviando informe_mercados.html por Telegram..."

          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document="@informe_mercados.html" \
            -F caption="Informe mercados diario"
      - name: Enviar resumen en texto por Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f resumen_mercados.txt ]; then
            RESUMEN=$(cat resumen_mercados.txt)
            curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="$RESUMEN"
          fi

      - name: Enviar alertas si las hay
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -s alertas_mercados.txt ]; then
            ALERTAS=$(cat alertas_mercados.txt)
            curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="$ALERTAS"
          fi
      - name: Preparar HTML para GitHub Pages
        run: |
          rm -rf public
          mkdir -p public
          cp screener_acciones.html public/index.html

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public